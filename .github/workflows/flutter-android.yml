name: Flutter Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'geode/**'
      - '.gitmodules'
      - '.github/workflows/flutter-android.yml'
  push:
    branches: [main]
    paths:
      - 'geode/**'
      - '.gitmodules'
      - '.github/workflows/flutter-android.yml'

permissions:
  contents: read

concurrency:
  group: flutter-android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Newest stable Flutter (Dart 3.13.5). Bump together with apps/geode/pubspec.yaml.
  FLUTTER_VERSION: '3.47.7'
  NDK_VERSION: '28.2.13676358'
  CMAKE_VERSION: '3.22.1'

jobs:
  flutter-checks:
    name: Dart lint and Flutter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: geode
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Download locked pub.dev libraries
        run: flutter pub get --enforce-lockfile
      - name: Lint Flutter app and packages
        # Infos count too: the porting guide requires zero analyzer issues.
        run: flutter analyze --no-pub --fatal-infos --fatal-warnings
      - name: Run application and package tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          status=0
          for package in apps/geode packages/*; do
            if [ -d "$package/test" ]; then
              name="$(basename "$package")"
              echo "::group::flutter test $package"
              (cd "$package" && flutter test --no-pub --reporter expanded \
                --file-reporter "json:$GITHUB_WORKSPACE/test-results/$name.json") || status=1
              echo "::endgroup::"
            fi
          done
          exit "$status"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: geode-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  debug-apk:
    name: Compile C++ engine and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: geode/apps/geode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v5
      # setup-gradle validates every Gradle wrapper in the checkout, so fetch the C++
      # dependencies afterwards: Oboe's example wrappers are never executed by this app.
      - name: Download pinned C++ dependencies
        working-directory: .
        run: git submodule update --init --recursive
      - name: Verify original non-Kotlin source import
        working-directory: .
        run: python3 geode/tools/verify_source_import.py
      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK missing}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' \
            "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
      - name: Download locked pub.dev libraries
        run: flutter pub get --enforce-lockfile
      - name: Build debug APK with C++ audio engine, analysis and visualizers
        run: flutter build apk --debug --no-pub --target-platform android-arm64,android-x64
      - name: Check native libraries and package checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          for abi in arm64-v8a x86_64; do
            for library in libgeode.so libprojectM-4.so libc++_shared.so; do
              unzip -l "$apk" "lib/$abi/$library" | grep -F "lib/$abi/$library"
            done
          done
          (cd "$(dirname "$apk")" && sha256sum app-debug.apk > app-debug.apk.sha256)
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v5
        with:
          name: geode-debug-${{ github.run_number }}
          path: |
            geode/apps/geode/build/app/outputs/flutter-apk/app-debug.apk
            geode/apps/geode/build/app/outputs/flutter-apk/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Android lint
        run: cd android && ./gradlew :app:lintDebug --stacktrace --no-daemon
      - name: Upload build and lint reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: geode-build-reports-${{ github.run_number }}
          path: geode/apps/geode/build/**/reports/
          if-no-files-found: ignore
          retention-days: 7
