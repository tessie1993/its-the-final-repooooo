name: geode
description: "Geode: music player, GPU visualizer and video suite."
version: 1.8.0+32
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.24.3
  vector_math: ^2.4.3
  file_picker: ^13.1.0
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  geode_native:
    path: ../../packages/geode_native
  geode_engine:
    path: ../../packages/geode_engine
  geode_data:
    path: ../../packages/geode_data
  geode_editor:
    path: ../../packages/geode_editor
  geode_playback:
    path: ../../packages/geode_playback
  geode_export:
    path: ../../packages/geode_export
  flame_3d: ^0.3.2
  ditredi: ^2.0.2
  model_viewer_plus: ^1.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/bioluminescent-sanctuary.png
    - assets/images/forest-sanctuary.png
    - assets/images/nature-pebble.png
    - assets/images/fern-dew.png
    - assets/images/crystal-fern.png
    - assets/images/stone-dial.png
    - assets/textures/
    - assets/models/
  shaders:
    - shaders/nature_stone.frag
