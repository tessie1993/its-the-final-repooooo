name: geode_data
description: "Presets, sessions, playlists, templates and every other persisted store."
version: 1.8.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  ffi: ^2.1.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  shared_preferences_android: ^2.4.10
  shared_preferences_platform_interface: ^2.4.1
  uuid: ^4.5.3
  geode_native:
    path: ../geode_native
  geode_engine:
    path: ../geode_engine
  geode_export:
    path: ../geode_export

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
