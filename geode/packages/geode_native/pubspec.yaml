name: geode_native
description: "Dart FFI bindings to libgeode and the Android entry points that cannot be Dart."
version: 1.8.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  ffigen: ^20.1.1

flutter:
  plugin:
    platforms:
      android:
        package: dev.geode.geode_native
        pluginClass: GeodeNativePlugin
